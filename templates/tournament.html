<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drooble Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #333);
        }
        .container {
            background-color: var(--tg-theme-secondary-bg-color, white);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--tg-theme-heading-color, #333);
            text-align: center;
            margin-bottom: 20px;
        }
        .matchup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background-color: var(--tg-theme-bg-color, #f9f9f9);
            border-radius: 10px;
            border-left: 4px solid var(--tg-theme-button-color, #007bff);
        }
        .player {
            font-size: 16px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #333);
        }
        .vs {
            color: var(--tg-theme-hint-color, #666);
            font-weight: bold;
            margin: 0 10px;
        }
        .status {
            text-align: center;
            margin: 20px 0;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, white);
            border-radius: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Drooble Tournament</h1>
        <div class="status">
            Tournament ID: {{ tournament_id }}
        </div>
        <div id="matchups">
            {% for matchup in matchups %}
            <div class="matchup">
                <div class="player">{{ matchup.player1 }}</div>
                <div class="vs">VS</div>
                <div class="player">{{ matchup.player2 }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Expand the web app to full height
        tg.expand();
        
        // Set up theme changes
        tg.ready();
    </script>
</body>
</html>
