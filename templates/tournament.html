<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drooble Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #333);
        }
        .container {
            background-color: var(--tg-theme-secondary-bg-color, white);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--tg-theme-heading-color, #333);
            text-align: center;
            margin-bottom: 20px;
        }
        .matchup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background-color: var(--tg-theme-bg-color, #f9f9f9);
            border-radius: 10px;
            border-left: 4px solid var(--tg-theme-button-color, #007bff);
        }
        .player {
            font-size: 16px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #333);
        }
        .vs {
            color: var(--tg-theme-hint-color, #666);
            font-weight: bold;
            margin: 0 10px;
        }
        .status {
            text-align: center;
            margin: 20px 0;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, white);
            border-radius: 10px;
            font-weight: 500;
        }
        .online-users {
            margin: 20px 0;
            padding: 15px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 10px;
        }
        .online-users h3 {
            margin: 0 0 10px 0;
            color: var(--tg-theme-heading-color, #333);
            font-size: 16px;
        }
        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-badge {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background-color: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, white);
            border-radius: 20px;
            font-size: 14px;
        }
        .user-badge .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Drooble Tournament</h1>
        <div class="status" id="status">
            Loading tournament...
        </div>
        <div class="online-users" id="online-users" style="display: none;">
            <h3>🟢 Online Participants</h3>
            <div class="user-list" id="user-list">
            </div>
        </div>
        <div id="matchups">
        </div>
    </div>
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Expand the web app to full height
        tg.expand();
        
        // Set up theme changes
        tg.ready();
        
        // Get tournament ID from URL parameters (Telegram uses tgWebAppStartParam)
        const urlParams = new URLSearchParams(window.location.search);
        const tournamentId = urlParams.get('tgWebAppStartParam');
        
        // Get user info from Telegram WebApp
        const user = tg.initDataUnsafe?.user || {};
        const userName = user.first_name || 'Anonymous';
        const userId = user.id || Math.random().toString(36).substr(2, 9);
        
        let ws = null;
        
        if (tournamentId) {
            // Fetch tournament data from API
            fetch(`/api/tournament/${tournamentId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Tournament not found');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('status').innerHTML = `Tournament ID: ${data.tournament_id}`;
                    
                    const matchupsDiv = document.getElementById('matchups');
                    matchupsDiv.innerHTML = '';
                    
                    if (data.matchups && data.matchups.length > 0) {
                        data.matchups.forEach(matchup => {
                            const matchupDiv = document.createElement('div');
                            matchupDiv.className = 'matchup';
                            matchupDiv.innerHTML = `
                                <div class="player">${matchup.player1}</div>
                                <div class="vs">VS</div>
                                <div class="player">${matchup.player2}</div>
                            `;
                            matchupsDiv.appendChild(matchupDiv);
                        });
                    } else {
                        matchupsDiv.innerHTML = '<div class="status">No matchups available</div>';
                    }
                    
                    // Connect to WebSocket for real-time user status
                    connectWebSocket();
                })
                .catch(error => {
                    document.getElementById('status').innerHTML = 'Error loading tournament';
                    console.error('Error:', error);
                });
        } else {
            document.getElementById('status').innerHTML = 'No tournament ID provided';
        }
        
        function connectWebSocket() {
            // Create WebSocket connection
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${tournamentId}?user_name=${encodeURIComponent(userName)}&user_id=${userId}`;
            
            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                console.log('WebSocket connected');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'users_update') {
                    updateUserList(data.users);
                }
            };
            
            ws.onclose = function() {
                console.log('WebSocket disconnected');
                // Try to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }
        
        function updateUserList(users) {
            const onlineUsersDiv = document.getElementById('online-users');
            const userListDiv = document.getElementById('user-list');
            
            if (users && users.length > 0) {
                onlineUsersDiv.style.display = 'block';
                userListDiv.innerHTML = '';
                
                users.forEach(user => {
                    const userBadge = document.createElement('div');
                    userBadge.className = 'user-badge';
                    userBadge.innerHTML = `
                        <div class="status-dot"></div>
                        ${user.name}
                    `;
                    userListDiv.appendChild(userBadge);
                });
            } else {
                onlineUsersDiv.style.display = 'none';
            }
        }
        
        // Clean up WebSocket connection when page closes
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
