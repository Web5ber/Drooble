<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding 8 Puzzle Race</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Design tokens — a night-race dashboard, grounded in the "race" premise of the game.
               Telegram theme vars win when present; these are the fallbacks. */
            --bg: #0b0e17;
            --panel: #12172400;
            --panel-solid: #161c2b;
            --lane: #1b2233;
            --lane-border: #2a3348;
            --ink: #eef1f8;
            --ink-dim: #8e97ad;
            --go: #35d68a;      /* start / progress */
            --amber: #ffb703;   /* highlight / timer */
            --danger: #ff5d5d;  /* opponent lane accent */
            --tile: #232c42;
            --tile-border: #34405e;
            --radius: 14px;
            --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'Space Mono', 'SFMono-Regular', Consolas, monospace;
        }
 
        * { box-sizing: border-box; }
 
        body {
            font-family: var(--font-display);
            max-width: 100%;
            margin: 0;
            padding: 18px;
            background:
                radial-gradient(circle at 15% -10%, rgba(53,214,138,0.10), transparent 45%),
                radial-gradient(circle at 100% 0%, rgba(255,183,3,0.08), transparent 40%),
                var(--tg-theme-bg-color, var(--bg));
            color: var(--tg-theme-text-color, var(--ink));
            min-height: 100vh;
        }
 
        .container {
            background-color: var(--tg-theme-secondary-bg-color, var(--panel-solid));
            padding: 22px 18px 26px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.05);
        }
 
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            margin-bottom: 6px;
            color: var(--tg-theme-link-color, var(--go));
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .back-btn:hover { opacity: 0.8; }
        .back-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 4px; }
 
        .flag-strip {
            height: 6px;
            border-radius: 4px;
            margin: 4px 0 18px;
            background-image: repeating-linear-gradient(
                90deg,
                var(--ink) 0 8px,
                transparent 8px 16px
            );
            opacity: 0.18;
        }
 
        h1 {
            color: var(--tg-theme-heading-color, var(--ink));
            text-align: center;
            margin: 0 0 4px;
            font-size: 22px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            text-align: center;
            color: var(--tg-theme-hint-color, var(--ink-dim));
            font-size: 13px;
            margin-bottom: 18px;
        }
 
        .game-section {
            margin: 18px 0 4px;
            padding: 16px 14px 20px;
            background-color: var(--tg-theme-hint-color, transparent);
            background-color: transparent;
            border-radius: var(--radius);
            transition: opacity 0.25s ease;
        }
        .game-section.disabled { opacity: 0.55; pointer-events: none; }
 
        .game-status {
            text-align: center;
            margin-bottom: 14px;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.02em;
            color: var(--tg-theme-hint-color, var(--ink-dim));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--danger);
            box-shadow: 0 0 0 0 rgba(255,93,93,0.5);
            animation: pulse 1.6s infinite;
        }
        .status-dot.ready { background: var(--go); box-shadow: 0 0 0 0 rgba(53,214,138,0.5); }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 currentColor; }
            70% { box-shadow: 0 0 0 6px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }
 
        .timer {
            font-family: var(--font-mono);
            font-size: 34px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.04em;
            margin: 4px 0 16px;
            color: var(--tg-theme-heading-color, var(--amber));
            font-variant-numeric: tabular-nums;
        }
 
        .split-screen {
            display: flex;
            gap: 14px;
            margin: 8px 0;
        }
 
        .player-lane {
            flex: 1;
            min-width: 0;
            background: var(--lane);
            border: 1px solid var(--lane-border);
            border-radius: var(--radius);
            padding: 12px 10px 14px;
            position: relative;
        }
        .player-lane.mine { border-color: rgba(53,214,138,0.35); }
        .player-lane.theirs { border-color: rgba(255,93,93,0.25); }
 
        .lane-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .avatar {
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
            color: #0b0e17;
            flex-shrink: 0;
        }
        .mine .avatar { background: var(--go); }
        .theirs .avatar { background: var(--danger); }
 
        .player-label {
            font-weight: 600;
            font-size: 13px;
            color: var(--tg-theme-heading-color, var(--ink));
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .player-meta {
            font-size: 10px;
            color: var(--ink-dim);
            font-family: var(--font-mono);
        }
 
        .puzzle-grid {
            position: relative;
            width: 100%;
            max-width: 160px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            background: repeating-conic-gradient(rgba(255,255,255,0.025) 0% 25%, transparent 0% 50%) 0 0/ 20px 20px;
            border-radius: 10px;
        }
 
        .puzzle-tile {
            position: absolute;
            width: 30.5%;
            height: 30.5%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(155deg, var(--tile), #1a2135);
            border: 1px solid var(--tile-border);
            color: var(--ink);
            font-weight: 700;
            font-family: var(--font-mono);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: left 0.18s cubic-bezier(.4,0,.2,1), top 0.18s cubic-bezier(.4,0,.2,1), transform 0.12s ease, background 0.15s ease;
            user-select: none;
        }
        .puzzle-tile:hover:not(.disabled) { background: linear-gradient(155deg, #2b3552, #1f273d); }
        .puzzle-tile:active:not(.disabled) { transform: scale(0.93); }
        .puzzle-tile:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
        .puzzle-tile.disabled { cursor: default; opacity: 0.85; }
        .puzzle-tile.pop { animation: pop 0.22s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
 
        .progress-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }
        .progress-bar {
            flex: 1;
            height: 8px;
            background-color: rgba(255,255,255,0.06);
            border-radius: 5px;
            overflow: hidden;
        }
        .mine .progress-fill { background: var(--go); }
        .theirs .progress-fill { background: var(--danger); }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        .move-count {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-dim);
            min-width: 34px;
            text-align: right;
        }
 
        .controls { text-align: center; margin-top: 22px; }
        .btn {
            background-color: var(--tg-theme-button-color, var(--go));
            color: var(--tg-theme-button-text-color, #0b0e17);
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font-display);
            letter-spacing: 0.01em;
            transition: transform 0.12s ease, opacity 0.15s ease;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.secondary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--lane-border);
        }
 
        .winner-announcement {
            position: relative;
            overflow: hidden;
            text-align: center;
            font-size: 19px;
            font-weight: 700;
            margin: 18px 0 4px;
            padding: 18px;
            background: linear-gradient(135deg, var(--go), #1fae6d);
            color: #0b0e17;
            border-radius: var(--radius);
            display: none;
        }
        .winner-announcement.lose { background: linear-gradient(135deg, var(--lane), var(--lane-border)); color: var(--ink); }
        .winner-announcement.show { display: block; }
        .winner-time {
            display: block;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 400;
            margin-top: 4px;
            opacity: 0.85;
        }
 
        .confetti-piece {
            position: absolute;
            top: -10px;
            width: 6px; height: 10px;
            opacity: 0.9;
            animation: fall 1.4s ease-in forwards;
            border-radius: 1px;
        }
        @keyframes fall {
            to { transform: translateY(140px) rotate(280deg); opacity: 0; }
        }
 
        @media (prefers-reduced-motion: reduce) {
            .puzzle-tile, .progress-fill, .status-dot, .confetti-piece { animation: none !important; transition: none !important; }
        }
 
        @media (max-width: 380px) {
            .puzzle-grid { max-width: 128px; }
            .puzzle-tile { font-size: 14px; }
            .timer { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="#" id="back-btn" class="back-btn" style="display: none;">&larr; Back to Tournament</a>
        <div class="flag-strip"></div>
        <h1>Sliding 8 Puzzle Race</h1>
        <p class="subtitle">First to solve it wins. Arrange the tiles 1&ndash;8 in order.</p>
 
        <div class="game-section disabled" id="game-section">
            <div class="game-status" id="game-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Waiting for all players to come online&hellip;</span>
            </div>
 
            <div class="timer" id="timer">00:00</div>
 
            <div class="split-screen">
                <div class="player-lane mine" id="player1-lane">
                    <div class="lane-header">
                        <div class="avatar" id="player1-avatar">P1</div>
                        <div>
                            <div class="player-label" id="player1-label">You</div>
                            <div class="player-meta">Lane 1</div>
                        </div>
                    </div>
                    <div class="puzzle-grid" id="player1-grid" role="group" aria-label="Your puzzle. Use arrow keys or tap a tile next to the empty space."></div>
                    <div class="progress-row">
                        <div class="progress-bar"><div class="progress-fill" id="player1-progress" style="width: 0%"></div></div>
                        <div class="move-count" id="player1-moves">0 mv</div>
                    </div>
                </div>
 
                <div class="player-lane theirs" id="player2-lane">
                    <div class="lane-header">
                        <div class="avatar" id="player2-avatar">P2</div>
                        <div>
                            <div class="player-label" id="player2-label">Opponent</div>
                            <div class="player-meta">Lane 2</div>
                        </div>
                    </div>
                    <div class="puzzle-grid" id="player2-grid" aria-hidden="true"></div>
                    <div class="progress-row">
                        <div class="progress-bar"><div class="progress-fill" id="player2-progress" style="width: 0%"></div></div>
                        <div class="move-count" id="player2-moves">0 mv</div>
                    </div>
                </div>
            </div>
 
            <div class="winner-announcement" id="winner-announcement"></div>
 
            <div class="controls">
                <button class="btn" id="start-btn">Start Race</button>
                <button class="btn secondary" id="reset-btn" style="display: none;">Rematch</button>
            </div>
        </div>
    </div>
 
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        try { tg.setHeaderColor && tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
 
        const urlParams = new URLSearchParams(window.location.search);
        const tournamentId = urlParams.get('tgWebAppStartParam');
 
        const backBtn = document.getElementById('back-btn');
        if (backBtn && tournamentId) {
            backBtn.href = `/?tgWebAppStartParam=${tournamentId}`;
            backBtn.style.display = 'inline-flex';
        }
 
        // Get user info from Telegram WebApp
        const user = tg.initDataUnsafe?.user || {};
        const userName = user.first_name || 'Anonymous';
        const userId = user.id || Math.random().toString(36).substr(2, 9);
 
        let ws = null;
        let reconnectAttempts = 0;
 
        let gameState = {
            players: [],
            myPlayerIndex: -1,
            myPuzzle: [],
            opponentPuzzle: [],
            myMoves: 0,
            opponentMoves: 0,
            gameStarted: false,
            gameEnded: false,
            startTime: null,
            timerInterval: null
        };
 
        const tileElements = { player1: {}, player2: {} };
 
        // Solved state: [1, 2, 3, 4, 5, 6, 7, 8, 0]
        const SOLVED_STATE = [1, 2, 3, 4, 5, 6, 7, 8, 0];
 
        function haptic(type) {
            try {
                if (type === 'success') tg.HapticFeedback?.notificationOccurred('success');
                else if (type === 'error') tg.HapticFeedback?.notificationOccurred('error');
                else tg.HapticFeedback?.impactOccurred('light');
            } catch (e) {}
        }
 
        function getValidMoves(emptyIndex) {
            const moves = [];
            const row = Math.floor(emptyIndex / 3);
            const col = emptyIndex % 3;
            if (row > 0) moves.push(emptyIndex - 3);
            if (row < 2) moves.push(emptyIndex + 3);
            if (col > 0) moves.push(emptyIndex - 1);
            if (col < 2) moves.push(emptyIndex + 1);
            return moves;
        }
 
        function swapTiles(puzzle, index1, index2) {
            [puzzle[index1], puzzle[index2]] = [puzzle[index2], puzzle[index1]];
        }
 
        function isSolved(puzzle) {
            return puzzle.every((val, index) => val === SOLVED_STATE[index]);
        }
 
        function shufflePuzzle() {
            let puzzle;
            do {
                puzzle = [...SOLVED_STATE];
                // Perform random valid moves (guarantees solvability); redo if it lands back on solved.
                for (let i = 0; i < 150; i++) {
                    const emptyIndex = puzzle.indexOf(0);
                    const validMoves = getValidMoves(emptyIndex);
                    const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                    swapTiles(puzzle, emptyIndex, randomMove);
                }
            } while (isSolved(puzzle));
            return puzzle;
        }
 
        function calculateProgress(puzzle) {
            let correct = 0;
            puzzle.forEach((val, index) => { if (val === SOLVED_STATE[index]) correct++; });
            return (correct / 9) * 100;
        }
 
        function positionTile(tile, index) {
            const row = Math.floor(index / 3);
            const col = index % 3;
            tile.style.left = `${col * (100 / 3)}%`;
            tile.style.top = `${row * (100 / 3)}%`;
        }
 
        // Builds persistent tile DOM nodes once per puzzle instance so moves can transition smoothly.
        function initGrid(puzzle, gridId, key, interactive) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            tileElements[key] = {};
            puzzle.forEach((value, index) => {
                if (value === 0) return;
                const tile = document.createElement('div');
                tile.className = 'puzzle-tile' + (interactive ? '' : ' disabled');
                tile.textContent = value;
                if (interactive) {
                    tile.tabIndex = 0;
                    tile.setAttribute('role', 'button');
                    tile.setAttribute('aria-label', `Tile ${value}`);
                    tile.addEventListener('click', () => {
                        const idx = gameState.myPuzzle.indexOf(value);
                        handleTileClick(idx);
                    });
                }
                positionTile(tile, index);
                grid.appendChild(tile);
                tileElements[key][value] = tile;
            });
        }
 
        function updateGridPositions(puzzle, key, movedValue) {
            puzzle.forEach((value, index) => {
                if (value === 0) return;
                const tile = tileElements[key][value];
                if (!tile) return;
                positionTile(tile, index);
                if (value === movedValue) {
                    tile.classList.remove('pop');
                    void tile.offsetWidth;
                    tile.classList.add('pop');
                }
            });
        }
 
        function setInteractive(key, interactive) {
            Object.values(tileElements[key]).forEach(tile => {
                tile.classList.toggle('disabled', !interactive);
                tile.tabIndex = interactive ? 0 : -1;
            });
        }
 
        function handleTileClick(index) {
            if (!gameState.gameStarted || gameState.gameEnded) return;
            const emptyIndex = gameState.myPuzzle.indexOf(0);
            const validMoves = getValidMoves(emptyIndex);
            if (!validMoves.includes(index)) return;
 
            const movedValue = gameState.myPuzzle[index];
            swapTiles(gameState.myPuzzle, emptyIndex, index);
            gameState.myMoves++;
            updateGridPositions(gameState.myPuzzle, 'player1', movedValue);
            updateProgress();
            haptic('impact');
 
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'puzzle_move',
                    puzzle: gameState.myPuzzle,
                    moves: gameState.myMoves,
                    player_id: userId,
                    tournament_id: tournamentId
                }));
            }
 
            if (isSolved(gameState.myPuzzle)) endGame(true);
        }
 
        // Arrow keys move the tile adjacent to the empty slot in that direction.
        document.addEventListener('keydown', (e) => {
            if (!gameState.gameStarted || gameState.gameEnded) return;
            const dirMap = { ArrowUp: 3, ArrowDown: -3, ArrowLeft: 1, ArrowRight: -1 };
            if (!(e.key in dirMap)) return;
            e.preventDefault();
            const emptyIndex = gameState.myPuzzle.indexOf(0);
            const targetIndex = emptyIndex + dirMap[e.key];
            const validMoves = getValidMoves(emptyIndex);
            if (validMoves.includes(targetIndex)) handleTileClick(targetIndex);
        });
 
        function updateProgress() {
            const myProgress = calculateProgress(gameState.myPuzzle);
            const opponentProgress = calculateProgress(gameState.opponentPuzzle);
            document.getElementById('player1-progress').style.width = `${myProgress}%`;
            document.getElementById('player2-progress').style.width = `${opponentProgress}%`;
            document.getElementById('player1-moves').textContent = `${gameState.myMoves} mv`;
            document.getElementById('player2-moves').textContent = `${gameState.opponentMoves} mv`;
        }
 
        function startTimer() {
            gameState.startTime = Date.now();
            gameState.timerInterval = setInterval(() => {
                const elapsed = Date.now() - gameState.startTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                document.getElementById('timer').textContent =
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
 
        function stopTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }
 
        function launchConfetti(container) {
            const colors = ['#35d68a', '#ffb703', '#eef1f8', '#ff5d5d'];
            for (let i = 0; i < 24; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = `${Math.random() * 0.3}s`;
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 1800);
            }
        }
 
        function endGame(isWinner) {
            if (gameState.gameEnded) return; // guard against duplicate/late messages
            gameState.gameEnded = true;
            stopTimer();
            haptic(isWinner ? 'success' : 'error');
 
            const finalTime = document.getElementById('timer').textContent;
            const announcement = document.getElementById('winner-announcement');
            announcement.innerHTML = '';
            announcement.classList.toggle('lose', !isWinner);
 
            if (isWinner) {
                announcement.textContent = `🏁 ${userName} wins!`;
                launchConfetti(announcement);
            } else {
                const opponentName = gameState.players[1 - gameState.myPlayerIndex]?.name || 'Your opponent';
                announcement.textContent = `${opponentName} crossed the line first.`;
            }
            const timeEl = document.createElement('span');
            timeEl.className = 'winner-time';
            timeEl.textContent = `Race time: ${finalTime}`;
            announcement.appendChild(timeEl);
            announcement.classList.add('show');
 
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'inline-block';
            document.getElementById('status-text').textContent = isWinner ? 'You won the race!' : 'Race finished.';
            setInteractive('player1', false);
        }
 
        function resetGame() {
            gameState.gameStarted = false;
            gameState.gameEnded = false;
            gameState.myMoves = 0;
            gameState.opponentMoves = 0;
            gameState.myPuzzle = shufflePuzzle();
            gameState.opponentPuzzle = shufflePuzzle();
 
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('winner-announcement').classList.remove('show', 'lose');
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('start-btn').disabled = gameState.players.length < 2;
            document.getElementById('reset-btn').style.display = 'none';
            document.getElementById('status-text').textContent = gameState.players.length >= 2
                ? 'All players online! Ready to race!'
                : `Waiting for players (${gameState.players.length}/2)…`;
 
            initGrid(gameState.myPuzzle, 'player1-grid', 'player1', true);
            initGrid(gameState.opponentPuzzle, 'player2-grid', 'player2', false);
            updateProgress();
 
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'puzzle_reset', tournament_id: tournamentId }));
            }
        }
 
        function setAvatar(elId, name) {
            const el = document.getElementById(elId);
            if (el && name) el.textContent = name.slice(0, 2).toUpperCase();
        }
 
        function updateStatusUI(count) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const section = document.getElementById('game-section');
            if (count >= 2) {
                section.classList.remove('disabled');
                dot.classList.add('ready');
                text.textContent = 'All players online! Ready to race!';
            } else {
                section.classList.add('disabled');
                dot.classList.remove('ready');
                text.textContent = `Waiting for players (${count}/2)…`;
            }
        }
 
        if (tournamentId) {
            fetch(`/api/tournament/${tournamentId}`)
                .then(response => {
                    if (!response.ok) throw new Error('Tournament not found');
                    return response.json();
                })
                .then(data => {
                    gameState.players = data.players || [];
                    gameState.myPlayerIndex = gameState.players.findIndex(p => p.id.toString() === userId.toString());
 
                    gameState.myPuzzle = shufflePuzzle();
                    gameState.opponentPuzzle = shufflePuzzle();
 
                    if (gameState.players[0]) {
                        document.getElementById('player1-label').textContent =
                            gameState.myPlayerIndex === 0 ? `${gameState.players[0].name} (You)` : gameState.players[0].name;
                        setAvatar('player1-avatar', gameState.players[0].name);
                    }
                    if (gameState.players[1]) {
                        document.getElementById('player2-label').textContent = gameState.players[1].name;
                        setAvatar('player2-avatar', gameState.players[1].name);
                    }
 
                    connectWebSocket();
                    initGrid(gameState.myPuzzle, 'player1-grid', 'player1', true);
                    initGrid(gameState.opponentPuzzle, 'player2-grid', 'player2', false);
                    updateProgress();
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('status-text').textContent = 'Could not load this race. Try reopening it from the tournament.';
                });
        } else {
            document.getElementById('status-text').textContent = 'No tournament linked — open this from your tournament page.';
        }
 
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${tournamentId}?user_name=${encodeURIComponent(userName)}&user_id=${userId}`;
 
            ws = new WebSocket(wsUrl);
 
            ws.onopen = function() {
                reconnectAttempts = 0;
                console.log('WebSocket connected');
            };
 
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
 
                if (data.type === 'users_update') {
                    gameState.players = data.users;
                    gameState.myPlayerIndex = gameState.players.findIndex(p => p.id.toString() === userId.toString());
 
                    if (gameState.players[0]) {
                        document.getElementById('player1-label').textContent =
                            gameState.myPlayerIndex === 0 ? `${gameState.players[0].name} (You)` : gameState.players[0].name;
                        setAvatar('player1-avatar', gameState.players[0].name);
                    }
                    if (gameState.players[1]) {
                        document.getElementById('player2-label').textContent = gameState.players[1].name;
                        setAvatar('player2-avatar', gameState.players[1].name);
                    }
 
                    updateStatusUI(data.users.length);
                    document.getElementById('start-btn').disabled = data.users.length < 2;
                }
 
                if (data.type === 'puzzle_move') {
                    if (data.player_id.toString() !== userId.toString()) {
                        const oldPuzzle = gameState.opponentPuzzle;
                        const movedValue = data.puzzle.find((v, i) => v !== 0 && v !== oldPuzzle[i]);
                        gameState.opponentPuzzle = data.puzzle;
                        gameState.opponentMoves = data.moves ?? gameState.opponentMoves + 1;
                        updateGridPositions(gameState.opponentPuzzle, 'player2', movedValue);
                        updateProgress();
 
                        if (!gameState.gameEnded && isSolved(gameState.opponentPuzzle)) {
                            endGame(false);
                        }
                    }
                }
 
                if (data.type === 'puzzle_reset') {
                    resetGame();
                }
 
                if (data.type === 'puzzle_start') {
                    if (!gameState.gameStarted) {
                        gameState.gameStarted = true;
                        startTimer();
                        document.getElementById('start-btn').style.display = 'none';
                        document.getElementById('status-text').textContent = 'Race in progress!';
                    }
                }
            };
 
            ws.onclose = function() {
                console.log('WebSocket disconnected, attempting to reconnect...');
                reconnectAttempts++;
                const delay = Math.min(3000 * reconnectAttempts, 15000);
                setTimeout(connectWebSocket, delay);
            };
 
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }
 
        document.getElementById('start-btn').addEventListener('click', function() {
            if (gameState.players.length >= 2 && !gameState.gameStarted) {
                gameState.gameStarted = true;
                startTimer();
                this.style.display = 'none';
                document.getElementById('status-text').textContent = 'Race in progress!';
 
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'puzzle_start', tournament_id: tournamentId }));
                }
            }
        });
 
        document.getElementById('reset-btn').addEventListener('click', resetGame);
    </script>
</body>
</html>
