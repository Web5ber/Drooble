<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drooble Tournament</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #333);
        }
        .container {
            background-color: var(--tg-theme-secondary-bg-color, white);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--tg-theme-heading-color, #333);
            text-align: center;
            margin-bottom: 20px;
        }
        .matchup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background-color: var(--tg-theme-bg-color, #f9f9f9);
            border-radius: 10px;
            border-left: 4px solid var(--tg-theme-button-color, #007bff);
        }
        .player {
            font-size: 16px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #333);
        }
        .vs {
            color: var(--tg-theme-hint-color, #666);
            font-weight: bold;
            margin: 0 10px;
        }
        .status {
            text-align: center;
            margin: 20px 0;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, white);
            border-radius: 10px;
            font-weight: 500;
        }
        .online-users {
            margin: 20px 0;
            padding: 15px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 10px;
        }
        .online-users h3 {
            margin: 0 0 10px 0;
            color: var(--tg-theme-heading-color, #333);
            font-size: 16px;
        }
        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-badge {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background-color: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, white);
            border-radius: 20px;
            font-size: 14px;
        }
        .user-badge .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .game-section {
            margin: 20px 0;
            padding: 20px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 10px;
            text-align: center;
        }
        .game-section.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .game-section h3 {
            margin: 0 0 15px 0;
            color: var(--tg-theme-heading-color, #333);
        }
        .game-status {
            margin: 10px 0;
            padding: 10px;
            background-color: var(--tg-theme-bg-color, #fff);
            border-radius: 8px;
            font-weight: 500;
        }
        .tic-tac-toe {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: 15px auto;
        }
        .cell {
            aspect-ratio: 1;
            background-color: var(--tg-theme-button-color, #007bff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: var(--tg-theme-button-text-color, white);
            cursor: pointer;
            transition: all 0.2s;
        }
        .cell:hover:not(.taken) {
            transform: scale(1.05);
        }
        .cell.taken {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .cell.x {
            background-color: #ff6b6b;
        }
        .cell.o {
            background-color: #4ecdc4;
        }
        .game-controls {
            margin-top: 15px;
        }
        .btn {
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color, #007bff);
            color: var(--tg-theme-button-text-color, white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--tg-theme-button-color, #0056b3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Drooble Tournament</h1>
        <div class="status" id="status">
            Loading tournament...
        </div>
        <div class="online-users" id="online-users" style="display: none;">
            <h3>🟢 Online Participants</h3>
            <div class="user-list" id="user-list">
            </div>
        </div>
        <div class="game-section disabled" id="game-section">
            <h3>🎮 Tic Tac Toe</h3>
            <div class="game-status" id="game-status">
                Waiting for all players to come online...
            </div>
            <div class="tic-tac-toe" id="tic-tac-toe">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <div class="game-controls">
                <button class="btn" id="reset-game" disabled>Reset Game</button>
            </div>
        </div>
        <div id="matchups">
        </div>
    </div>
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Expand the web app to full height
        tg.expand();
        
        // Set up theme changes
        tg.ready();
        
        // Get tournament ID from URL parameters (Telegram uses tgWebAppStartParam)
        const urlParams = new URLSearchParams(window.location.search);
        const tournamentId = urlParams.get('tgWebAppStartParam');
        
        // Get user info from Telegram WebApp
        const user = tg.initDataUnsafe?.user || {};
        const userName = user.first_name || 'Anonymous';
        const userId = user.id || Math.random().toString(36).substr(2, 9);
        
        let ws = null;
        let gameState = {
            board: Array(9).fill(null),
            currentPlayer: 'X',
            gameActive: false,
            players: [],
            currentTurnIndex: 0,
            myPlayerIndex: -1 // Track which player index this user is
        };
        
        if (tournamentId) {
            // Fetch tournament data from API
            fetch(`/api/tournament/${tournamentId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Tournament not found');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('status').innerHTML = `Tournament ID: ${data.tournament_id}`;
                    
                    const matchupsDiv = document.getElementById('matchups');
                    matchupsDiv.innerHTML = '';
                    
                    if (data.matchups && data.matchups.length > 0) {
                        data.matchups.forEach(matchup => {
                            const matchupDiv = document.createElement('div');
                            matchupDiv.className = 'matchup';
                            matchupDiv.innerHTML = `
                                <div class="player">${matchup.player1}</div>
                                <div class="vs">VS</div>
                                <div class="player">${matchup.player2}</div>
                            `;
                            matchupsDiv.appendChild(matchupDiv);
                        });
                    } else {
                        matchupsDiv.innerHTML = '<div class="status">No matchups available</div>';
                    }
                    
                    // Store tournament players for game logic
                    gameState.players = data.players || [];
                    
                    // Connect to WebSocket for real-time user status
                    connectWebSocket();
                    
                    // Initialize game UI
                    initializeGame();
                })
                .catch(error => {
                    document.getElementById('status').innerHTML = 'Error loading tournament';
                    console.error('Error:', error);
                });
        } else {
            document.getElementById('status').innerHTML = 'No tournament ID provided';
        }
        
        function connectWebSocket() {
            // Create WebSocket connection
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${tournamentId}?user_name=${encodeURIComponent(userName)}&user_id=${userId}`;
            
            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                console.log('WebSocket connected');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'users_update') {
                    updateUserList(data.users);
                } else if (data.type === 'game_move') {
                    handleGameMove(data);
                } else if (data.type === 'game_reset') {
                    resetGameUI();
                }
            };
            
            ws.onclose = function() {
                console.log('WebSocket disconnected');
                // Try to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }
        
        function updateUserList(users) {
            const onlineUsersDiv = document.getElementById('online-users');
            const userListDiv = document.getElementById('user-list');
            const gameSection = document.getElementById('game-section');
            const gameStatus = document.getElementById('game-status');
            
            if (users && users.length > 0) {
                onlineUsersDiv.style.display = 'block';
                userListDiv.innerHTML = '';
                
                users.forEach(user => {
                    const userBadge = document.createElement('div');
                    userBadge.className = 'user-badge';
                    userBadge.innerHTML = `
                        <div class="status-dot"></div>
                        ${user.name}
                    `;
                    userListDiv.appendChild(userBadge);
                });
                
                // Check if all tournament players are online
                const allPlayersOnline = gameState.players.length > 0 && 
                    gameState.players.every(player => 
                        users.some(user => user.id == player.id)
                    );
                
                if (allPlayersOnline && users.length >= 2) {
                    gameSection.classList.remove('disabled');
                    
                    // Determine this user's player index from tournament players (not online users)
                    if (gameState.myPlayerIndex === -1) {
                        const myPlayerIndex = gameState.players.findIndex(p => p.id.toString() === userId.toString());
                        if (myPlayerIndex !== -1) {
                            gameState.myPlayerIndex = myPlayerIndex;
                        }
                    }
                    
                    if (!gameState.gameActive) {
                        gameState.gameActive = true; // Actually activate the game
                        gameStatus.textContent = 'All players online! Game ready to start.';
                        document.getElementById('reset-game').disabled = false;
                    } else {
                        updateGameStatus();
                    }
                } else {
                    gameSection.classList.add('disabled');
                    gameStatus.textContent = `Waiting for all players to come online (${users.length}/${gameState.players.length})`;
                    document.getElementById('reset-game').disabled = true;
                }
            } else {
                onlineUsersDiv.style.display = 'none';
                gameSection.classList.add('disabled');
                gameStatus.textContent = 'Waiting for players to come online...';
                document.getElementById('reset-game').disabled = true;
            }
        }
        
        function initializeGame() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            
            document.getElementById('reset-game').addEventListener('click', resetGame);
        }
        
        function handleCellClick(e) {
            const index = parseInt(e.target.dataset.index);
            
            console.log('Cell clicked:', index);
            console.log('Game state:', gameState);
            console.log('Board at index:', gameState.board[index]);
            console.log('Game active:', gameState.gameActive);
            console.log('My player index:', gameState.myPlayerIndex);
            console.log('Current turn index:', gameState.currentTurnIndex);
            
            if (gameState.board[index] || !gameState.gameActive) {
                console.log('Move rejected: cell taken or game not active');
                return;
            }
            
            // DEBUG: Temporarily disable turn validation for testing
            // Check if it's this user's turn
            // if (gameState.myPlayerIndex !== gameState.currentTurnIndex) {
            //     console.log('Move rejected: not your turn');
            //     return; // Not this user's turn
            // }
            
            console.log('Move accepted, making move');
            // Make the move
            makeMove(index, gameState.currentPlayer);
        }
        
        function makeMove(index, player) {
            gameState.board[index] = player;
            
            // Update UI
            const cell = document.querySelector(`[data-index="${index}"]`);
            cell.textContent = player;
            cell.classList.add('taken', player.toLowerCase());
            
            // Send move to server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'game_move',
                    index: index,
                    player: player,
                    tournament_id: tournamentId
                }));
            }
            
            // Check for winner
            if (checkWinner()) {
                gameState.gameActive = false;
                document.getElementById('game-status').textContent = `${player} wins! 🎉`;
                return;
            }
            
            // Check for draw
            if (gameState.board.every(cell => cell !== null)) {
                gameState.gameActive = false;
                document.getElementById('game-status').textContent = "It's a draw! 🤝";
                return;
            }
            
            // Switch player
            gameState.currentPlayer = gameState.currentPlayer === 'X' ? 'O' : 'X';
            gameState.currentTurnIndex = (gameState.currentTurnIndex + 1) % 2;
            updateGameStatus();
        }
        
        function handleGameMove(data) {
            if (data.tournament_id !== tournamentId) return;
            
            gameState.board[data.index] = data.player;
            gameState.currentPlayer = data.player === 'X' ? 'O' : 'X';
            
            const cell = document.querySelector(`[data-index="${data.index}"]`);
            cell.textContent = data.player;
            cell.classList.add('taken', data.player.toLowerCase());
            
            if (checkWinner()) {
                gameState.gameActive = false;
                document.getElementById('game-status').textContent = `${data.player} wins! 🎉`;
                return;
            }
            
            if (gameState.board.every(cell => cell !== null)) {
                gameState.gameActive = false;
                document.getElementById('game-status').textContent = "It's a draw! 🤝";
                return;
            }
            
            updateGameStatus();
        }
        
        function checkWinner() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6] // diagonals
            ];
            
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (gameState.board[a] && 
                    gameState.board[a] === gameState.board[b] && 
                    gameState.board[a] === gameState.board[c]) {
                    return true;
                }
            }
            return false;
        }
        
        function updateGameStatus() {
            if (gameState.gameActive) {
                const currentPlayerName = gameState.players[gameState.currentTurnIndex]?.name || gameState.currentPlayer;
                
                if (gameState.myPlayerIndex === gameState.currentTurnIndex) {
                    document.getElementById('game-status').textContent = `Your turn (${gameState.currentPlayer})`;
                } else {
                    document.getElementById('game-status').textContent = `${currentPlayerName}'s turn (${gameState.currentPlayer})`;
                }
            }
        }
        
        function resetGame() {
            gameState.board = Array(9).fill(null);
            gameState.currentPlayer = 'X';
            gameState.gameActive = true;
            gameState.currentTurnIndex = 0;
            gameState.myPlayerIndex = -1; // Reset player index
            
            resetGameUI();
            
            // Notify other players
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'game_reset',
                    tournament_id: tournamentId
                }));
            }
            
            updateGameStatus();
        }
        
        function resetGameUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x', 'o');
            });
            
            gameState.board = Array(9).fill(null);
            gameState.currentPlayer = 'X';
            gameState.gameActive = true;
            gameState.currentTurnIndex = 0;
            gameState.myPlayerIndex = -1; // Reset player index
            
            updateGameStatus();
        }
        
        // Clean up WebSocket connection when page closes
        window.addEventListener('beforeunload', function() {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
